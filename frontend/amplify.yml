# AWS Amplify Hosting build spec (monorepo app root: frontend/). Not deployed.
# The evidence JSON in public/ is pre-built by scripts/build_data.py,
# because the sources (D:\PLAN_BLOCK18) are not available to a cloud build.
# SPA routing needs one rewrite rule in the Amplify console:
#   source </^[^.]+$|\.(?!(css|js|json|png|svg|ico|txt|woff|woff2|map)$)([^.]+$)/>  target /index.html  type 200 (Rewrite)
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run test
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
