dataset_id: "hfbtp"
dataset_name: "Hyperledger Fabric Benchmark & Tuning Platform Dataset"
version: "1.0.0"
source_url: "Pending literature citation - file recovered from prior research campaign"
citation: "Pending literature audit"
license: "Check repository license prior to distribution"

raw_files:
  - filename: "HFBTP.csv"
    sha256: "CE295D6451787FEFCFE2101579238CDA4BEDE8539BC302E6A482AA4E5782BD5E"
    md5: "E9275C49A2D7DC1F2A4015B6D8B28482"
    file_size_bytes: 988672
    description: "Raw static benchmark grid - one observation per (Set Arrival Rate, Block Size, Orderers) cell"
    original_file_timestamp: "2023-10-25"

# Columns as they appear in the file:
# "Set Transaction Arrival Rate", "Actual Transaction Arrival Rate",
# "Block Size", "Orderers",
# "Throughput", "Avg Latency", "Min Latency", "Max Latency"

target_variables:
  - name: "Throughput"
    column_header: "Throughput"
    unit: "tx/s"
    description: "Committed transactions per second at the given configuration"
  - name: "Avg Latency"
    column_header: "Avg Latency"
    unit: "s"
    description: "Average end-to-end transaction latency in seconds"

# Min Latency and Max Latency are post-execution measurements - NOT prediction targets
# and NOT legitimate predictors. Listed below for completeness only.
additional_columns:
  - name: "Min Latency"
    unit: "s"
    description: "Minimum observed latency - post-execution measurement. Excluded from features and targets."
  - name: "Max Latency"
    unit: "s"
    description: "Maximum observed latency - post-execution measurement. Excluded from features and targets."

features:
  - name: "Set Transaction Arrival Rate"
    type: "numerical"
    unit: "tx/s"
    description: "Pre-execution workload parameter. Safe predictor: known at decision time."
  - name: "Block Size"
    type: "numerical"
    unit: "transactions per block (MaxMessageCount)"
    description: "Fabric block batch size configuration parameter. Safe predictor."
  - name: "Orderers"
    type: "numerical"
    unit: "count"
    description: "Number of ordering service nodes. Safe predictor: a configuration setting."

caution_columns:
  - name: "Actual Transaction Arrival Rate"
    unit: "tx/s"
    description: >
      Measured arrival rate recorded during the run. Corr(Throughput)=0.985.
      Do NOT use as a predictor of Throughput without leakage analysis -
      it is contemporaneous with the target.

experimental_setup:
  blockchain_type: "Hyperledger Fabric"
  benchmark_tool: "Pending literature confirmation"
  is_time_series: false
  has_replications: false
  grid_dimensions:
    unique_set_arrival_rates: 39
    arrival_rate_range: "10-200 tx/s step 5"
    unique_block_sizes: 159
    block_size_range: "10-800 txs step 5"
    unique_orderer_counts: 4
    orderer_values: [3, 5, 7, 9]
    full_grid_size: 24804
    actual_rows: 24687
    missing_cells: 117
    coverage_pct: 99.528

data_quality:
  missing_values: 0
  exact_duplicate_rows: 0
  rows_with_large_set_vs_actual_divergence_gt5: 20
  divergence_note: >
    20 rows at high workload (185-200 tx/s) show >5 tx/s gap between set and actual
    arrival rate, consistent with saturation at the ordering service.
    These are legitimate high-load artifacts, not data errors.

notes: >
  Verified static benchmark grid: one observation per (Set Arrival Rate, Block Size,
  Orderers) combination. No timestamps, no repeated trials per cell. All 8 columns
  present with zero missing values and zero exact duplicate rows. Min/Max Latency are
  post-execution measurements excluded from prediction features. Checksum identity
  confirmed against prior research campaign MD5 record. Grid is 99.5% complete;
  117 cells missing (reason unknown - pending literature inspection).

audit_status: "COMPLETED - see docs/hfbtp_audit_report.md"
