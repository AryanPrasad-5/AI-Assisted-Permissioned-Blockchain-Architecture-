<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80" fill="none">
  <!-- Rounded container background -->
  <rect width="100" height="100" rx="20" fill="#0F172A"/>
  
  <!-- Subtle background grid -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="50" y1="20" x2="50" y2="80" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Permissioned Ledger Block / Node Geometry -->
  <!-- Top Face -->
  <polygon points="50,22 76,36 50,50 24,36" fill="#1E293B" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="24,36 50,50 50,78 24,64" fill="#0F172A" stroke="#0284C7" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="50,50 76,36 76,64 50,78" fill="#1E293B" stroke="#0369A1" stroke-width="2" stroke-linejoin="round"/>

  <!-- Distributed Consensus Nodes -->
  <circle cx="50" cy="22" r="3.5" fill="#38BDF8"/>
  <circle cx="24" cy="36" r="3.5" fill="#38BDF8"/>
  <circle cx="76" cy="36" r="3.5" fill="#38BDF8"/>
  <circle cx="50" cy="50" r="3" fill="#94A3B8"/>
  <circle cx="24" cy="64" r="3" fill="#0284C7"/>
  <circle cx="76" cy="64" r="3" fill="#0284C7"/>
  <circle cx="50" cy="78" r="3.5" fill="#0284C7"/>

  <!-- Adaptive Telemetry Curve -->
  <path d="M16 58 C 32 68, 42 34, 60 44 C 68 49, 76 34, 84 28" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/>
  <circle cx="84" cy="28" r="2.5" fill="#F8FAFC"/>
</svg>
